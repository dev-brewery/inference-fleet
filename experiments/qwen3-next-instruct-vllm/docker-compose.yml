services:
  # ============================================
  # MAIN AI SERVICE - Qwen3-Next-Instruct with vLLM
  # ============================================
  qwen3-next-instruct-vllm:
    build:
      context: .
      dockerfile: Dockerfile.vllm
    image: qwen3-vllm:latest
    container_name: qwen3-next-instruct-vllm
    restart: unless-stopped

    ports:
      - "8000:8000"

    volumes:
      - /storage/models:/models:ro
      - ~/llm-hosts/qwen3-next-instruct-vllm/start.sh:/start.sh:ro

    entrypoint: ["/bin/sh", "/start.sh"]

    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu, compute, utility]

    runtime: nvidia

    environment:
      NVIDIA_VISIBLE_DEVICES: "all"
      CUDA_VISIBLE_DEVICES: "0,1"
      PYTHONUNBUFFERED: "1"

    cap_add:
      - IPC_LOCK

    ulimits:
      memlock:
        soft: -1
        hard: -1

    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 180s

    networks:
      - monitoring

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

    shm_size: '16gb'

  # ============================================
  # MONITORING STACK
  # ============================================

  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus-vllm
    restart: always
    ports:
      - "9091:9090"
    volumes:
      - ~/llm-hosts/qwen3-next-instruct-vllm/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ~/llm-hosts/qwen3-next-instruct-vllm/prometheus/data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'
      - '--web.enable-lifecycle'
    networks:
      - monitoring
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  grafana:
    image: grafana/grafana:latest
    container_name: grafana-vllm
    restart: always
    ports:
      - "3001:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_INSTALL_PLUGINS=
      - GF_SERVER_ROOT_URL=http://localhost:3001
    volumes:
      - ~/llm-hosts/qwen3-next-instruct-vllm/grafana/data:/var/lib/grafana
      - ~/llm-hosts/qwen3-next-instruct-vllm/grafana/provisioning:/etc/grafana/provisioning
    depends_on:
      - prometheus
    networks:
      - monitoring
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.49.1
    container_name: cadvisor-vllm
    restart: always
    ports:
      - "8084:8080"
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    privileged: true
    devices:
      - /dev/nvidia0
      - /dev/nvidia1
      - /dev/nvidiactl
    depends_on:
      - prometheus
    networks:
      - monitoring
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  node-exporter:
    image: prom/node-exporter:latest
    container_name: node-exporter-vllm
    restart: always
    ports:
      - "9101:9100"
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    command:
      - '--path.procfs=/host/proc'
      - '--path.sysfs=/host/sys'
      - '--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)'
    networks:
      - monitoring
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

networks:
  monitoring:
    driver: bridge
