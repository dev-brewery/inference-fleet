global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    monitor: 'qwen35-opus-q6-server'

scrape_configs:
  # Prometheus self-monitoring
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # cAdvisor - Container metrics
  - job_name: 'cadvisor'
    static_configs:
      - targets: ['cadvisor:8080']

  # Node Exporter - Host metrics
  - job_name: 'node'
    static_configs:
      - targets: ['node-exporter:9100']

  # LLaMA Server built-in metrics
  - job_name: 'qwen35-opus-q6'
    static_configs:
      - targets: ['qwen35-opus-q6:8080']
    metrics_path: '/metrics'
