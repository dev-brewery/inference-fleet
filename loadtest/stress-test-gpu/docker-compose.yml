services:
  # ============================================================================
  # STRESS-TEST STACK — Thermal validation on 2x Tesla P40
  #
  # 8× Qwen3-4B instances (4 per GPU) for maximum concurrent prefill
  # Each instance: 2048 ctx × 8 slots = 32 concurrent per GPU, 64 total
  #
  # VRAM per GPU: 4 × (2.4 GB model + 2.25 GB KV) = 18.6 GB
  # Headroom per GPU: 5.4 GB ✓
  # ============================================================================

  # ----------------------------- GPU 0 (4 instances) --------------------------

  stress-0a:
    image: ghcr.io/ggml-org/llama.cpp:server-cuda
    container_name: stress-0a
    restart: unless-stopped
    expose:
      - "8080"
    volumes:
      - /storage/models:/models:ro
      - ~/llm-hosts/stress-test-gpu/start-4b.sh:/start.sh:ro
    entrypoint: ["/bin/sh", "/start.sh"]
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ['0']
              capabilities: [gpu, compute, utility]
    runtime: nvidia
    environment:
      NVIDIA_VISIBLE_DEVICES: "0"
      CTX_SIZE: "4096"
      PARALLEL_SLOTS: "4"
      PORT: "8080"
      THREADS: "4"
    ulimits:
      memlock: { soft: -1, hard: -1 }
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    networks:
      - stress-net
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

