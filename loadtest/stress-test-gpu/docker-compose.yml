  # ----------------------------- Driver ---------------------------------------

  stress-driver:
    image: stress-driver:latest
    pull_policy: never
    container_name: stress-driver
    restart: unless-stopped
    ports:
      - "8085:8080"
    environment:
      # GPU 0 backends
      BACKEND_0A: "http://stress-0a:8080"
      BACKEND_0B: "http://stress-0b:8080"
      BACKEND_0C: "http://stress-0c:8080"
      BACKEND_0D: "http://stress-0d:8080"
      # GPU 1 backends
      BACKEND_1A: "http://stress-1a:8080"
      BACKEND_1B: "http://stress-1b:8080"
      BACKEND_1C: "http://stress-1c:8080"
      BACKEND_1D: "http://stress-1d:8080"
      # Hammer config — shorter prefills for faster cycling
      WORKERS_PER_BACKEND: "8"
      PREFILL_TOKENS: "800"
      MAX_OUTPUT_TOKENS: "32"
      AUTOSTART: "1"
    depends_on:
      - stress-0a
      - stress-0b
      - stress-0c
      - stress-0d
      - stress-1a
      - stress-1b
      - stress-1c
      - stress-1d
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8080/health',timeout=3).status==200 else 1)"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 120s
    networks:
      - stress-net
    logging:
      driver: json-file
      options: { max-size: "20m", max-file: "3" }

networks:
  stress-net:
    driver: bridge
